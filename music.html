<style>
  .release-section { margin-bottom: 4rem; }
  .release-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--blue-light);
    margin-bottom: 1.5rem;
  }

  .release-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  /* Spotify's own compact embed comes at a fixed short height - the card
     just needs rounded corners, no aspect-ratio wrapper required. */
  .spotify-embed {
    border-radius: 16px;
    overflow: hidden;
  }

  /* YouTube embeds are natural 16:9 video, not a short horizontal bar like
     Spotify's - this wrapper keeps that real aspect ratio responsive at any
     width, using the same rounded-corner treatment so it still reads as
     part of the same card system. */
  .youtube-embed {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--glass-edge);
  }

  .youtube-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .placeholder-note {
    text-align: center;
    opacity: 0.55;
    font-size: 0.9rem;
    max-width: 60ch;
    margin: 0 auto 3rem;
    line-height: 1.6;
  }
</style>
</head>
