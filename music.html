<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - The Liquid Hotplates</title>
<link rel="icon" type="image/png" href="images/home-images/logo.png">
<link rel="stylesheet" href="styles.css">
<style>

  /*wraps the whole section of releases spotify + youtube
    and controls the padding/spacing below it*/
  .release-section { margin-bottom: 4rem; }
  /*"on youtube" text*/
  .release-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--blue-light);
    margin-bottom: 1.5rem;
  }

  /*grid that holds all the video embeds, auto-fits as many 
    as possible onto each row*/
  .release-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  /*spotify's given embeds, ready to use when that section gets uncommented*/
  .spotify-embed {
    border-radius: 16px;
    overflow: hidden;
  }

  /*youtube wrapper that forces everything into the same shape*/
  .youtube-embed {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--glass-edge);
  }

  .youtube-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  
</style>
</head>
